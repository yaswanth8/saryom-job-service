spring:
  application:
    name: saryom-job-service
  threads:
    virtual:
      enabled: true
  datasource:
    # No currentSchema parameter: a pooler in front of Postgres may reject the
    # startup option it becomes. Hibernate and Flyway are told the schema
    # explicitly below, and the database role defaults its search_path to it.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saryom}
    username: ${DB_USER:saryom_jobs}
    password: ${DB_PASSWORD:saryom_jobs_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: jobs
  flyway:
    enabled: true
    schemas: jobs
    default-schema: jobs

server:
  port: ${PORT:8088}

saryom:
  jobs:
    rls:
      # Writes the caller's identity into each transaction so the database's row
      # level security policies can see it. Off only for the H2 test suite,
      # which has no policies to satisfy.
      enabled: ${JOBS_RLS_ENABLED:true}
    import:
      # Rows accepted in one upload. A tracker rarely holds more than a few
      # hundred; the cap keeps one request from holding a transaction for long.
      max-rows: ${JOBS_IMPORT_MAX_ROWS:1000}
    tokens:
      max-per-user: ${JOBS_TOKENS_MAX_PER_USER:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Observability: metrics, traces and logs over OTLP to Grafana Cloud's free
  # tier (or any OTLP backend). Off unless OTLP_ENABLED=true, so local runs,
  # tests and the Docker build never try to reach a collector. Setup and the
  # env vars to set: saryom-api-gateway/docs/observability.md.
  tracing:
    sampling:
      # Traffic is low, so keep every trace. Lower it if the free tier fills up.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
        # One data point per series per minute, the free tier's included rate.
        step: 60s
        # Prometheus convention, and what the committed dashboard queries.
        base-time-unit: seconds
  opentelemetry:
    resource-attributes:
      service.namespace: saryom
      deployment.environment.name: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${OTLP_AUTH_HEADER:}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${OTLP_AUTH_HEADER:}
  metrics:
    distribution:
      # A handful of fixed latency buckets, enough for p50/p95/p99 panels and
      # alerts. The defaults would add ~70 series per endpoint and use up the
      # free tier's 10k series. 30s and 60s catch Render cold starts.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  observations:
    enable:
      # Spring Security wraps every request in a dozen filter-chain spans;
      # they bury the spans that matter and use up the trace allowance.
      spring.security: false
